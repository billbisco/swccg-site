# swccg-guild/work#1360 Archive Droid staff page. Same strict staff check as /admin/operations/.
# Included inside the swccg.com HTTPS server, after swccg-operations-staff-gateway.conf.
location = /admin/operations/archive-droid { return 308 /admin/operations/archive-droid/; }
location ^~ /admin/operations/archive-droid/ {
    limit_except GET { deny all; }
    auth_request /_swccg_operations_staff_check;
    error_page 401 403 =403 /_swccg_operations_staff_denied;
    alias /mnt/HC_Volume_107153504/archive-droid-view/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'none'; img-src https://wiki.swccg.com https://swccg.com; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    include /etc/nginx/snippets/swccg-hsts.conf;
    access_log off;
}

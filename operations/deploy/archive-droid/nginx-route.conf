# swccg-guild/work#1360 Archive Droid page. Unlisted and read-only (Bill, 2026-11-25):
# no staff gate; anyone with the URL may view it. Do not list this path in robots.txt
# (a Disallow would advertise it). Rely on X-Robots-Tag and a meta robots noindex.
# The Operations overview stays staff-gated and may keep its link. POST and other
# write methods are denied.
location = /admin/operations/archive-droid { return 308 /admin/operations/archive-droid/; }
location ^~ /admin/operations/archive-droid/ {
    limit_except GET { deny all; }
    alias /mnt/HC_Volume_107153504/archive-droid-view/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'none'; img-src https://wiki.swccg.com https://swccg.com; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    include /etc/nginx/snippets/swccg-hsts.conf;
    access_log off;
}

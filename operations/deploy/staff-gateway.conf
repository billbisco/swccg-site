# Include only within the approved HTTPS site server. No public upstream listener.
location = /admin/operations { return 308 /admin/operations/; }
location = /admin/operations/ {
    limit_except GET { deny all; }
    auth_request /_swccg_operations_staff_check;
    auth_request_set $swccg_ops_staff_status $upstream_status;
    error_page 401 403 =403 /_swccg_operations_staff_denied;
    proxy_pass http://unix:/run/swccg-operations-gateway/dashboard.sock:/;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header X-SWCCG-Staff-Decision $swccg_ops_staff_status;
    proxy_set_header Content-Length "";
    add_header Cache-Control "no-store, private" always;
    include /etc/nginx/snippets/swccg-hsts.conf;
    proxy_buffering off;
    proxy_cache off;
    access_log off;
}
location ^~ /admin/operations/ { return 404; }
location = /_swccg_operations_staff_check {
    internal;
    proxy_pass http://127.0.0.1:17031/login/staff/authorize;
    proxy_method GET;
    proxy_pass_request_body off;
    proxy_pass_request_headers off;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host swccg.com;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Content-Length "";
    proxy_cache off;
    access_log off;
}
location = /_swccg_operations_staff_denied {
    internal;
    default_type text/html;
    add_header Cache-Control "no-store, private" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    include /etc/nginx/snippets/swccg-hsts.conf;
    return 403 '<!doctype html><html lang="en"><meta charset="utf-8"><title>Staff access required</title><p>Sign in or renew your staff verification via the <a href="/login/staff">staff console</a>, then return to <a href="/admin/operations/">Operations Dashboard</a>.</p></html>';
}

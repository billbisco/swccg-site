# HTML navigation only; hostname check excludes staging and test.
map "$server_name:$request_method:$status:$sent_http_content_type" $ops_audience_emit {
    default 0;
    ~^swccg\.com:GET:2[0-9][0-9]:text/html 1;
}
map $uri $ops_audience_scope {
    default site;
    ~^/wiki/ wiki;
    ~^/play/ play;
    ~^/forum/ forum;
}
map $http_user_agent $ops_audience_class {
    default unknown;
    ~*(bot|crawler|spider|headless|curl|wget|python|scrapy|slurp|httpclient|preview) automation;
    ~*Mozilla/.*(Chrome/|Firefox/|Safari/|Edg/|OPR/) browser;
}
# Address exists only in the local socket datagram, never an additional log file.
log_format ops_audience 'v1 $msec $ops_audience_scope $ops_audience_class $remote_addr';
